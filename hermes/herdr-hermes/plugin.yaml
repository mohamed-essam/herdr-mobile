name: herdr-hermes
version: 0.1.0
description: "Streams a Hermes session to herdr-mobile's chat view."
requires_env: []
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - on_interim_message
  - pre_tool_call
  - post_tool_call
  - agent_loop_stopped
  - on_session_end
  - on_session_reset
  - on_human_input_request
